meta:
  config-version: "1.0"
  last_updated: "2024-11-17"
api:
  # API Token is the unique core, others surround it.
  providers:
    # Preconfig some providers for convenience.
    aihubmix:
      endpoint: https://aihubmix.com
      token: sk-B----------------------------------------------9
    openrouter:
      endpoint: https://openrouter.ai
      token: sk-C----------------------------------------------8
    groq:
      note: actually no openai models except whisper 3/3turbo
      endpoint: https://api.groq.com/openai
      token: gsk_SZ------------------------------------------------9Y
      # proxy settings are applied per API token.
      recommend-proxy: proxy1

  models:
    # Structure patterns:
    #   Path A: model_base -> providers -> provider_name -> [api-name, overrides]
    #   Path B: model_base -> variants -> variant_name -> providers -> provider_name -> [api-name, overrides]
    # Lookup: api-name ?? model_key (if api-name omitted, use model key as API call name)
    #
    # Field explanations:
    #   api-scheme: API protocol - determines call method AND output format
    #     - openai-gpt: OpenAI-compatible chat API → markdown output
    #     - google-gemini: Google Gemini API → markdown output
    #     - openai-whisper: Whisper transcription API → whisper-json output
    #   additional-capabilities: Extra input modalities (audio-input, image-input)
    #   applicable-tasks: UI filter tags for ModelSelector widget
    #     - text-chat: General text conversation
    #     - audio-transcription: Speech-to-text (includes native ASR + multimodal with audio)
    #     - image-analysis: Vision/image understanding
    
    # Example: model with variants (dated versions)
    claude-4-sonnet: # is api name if not overridden
      display-name: "Claude 4 Sonnet"
      api-scheme: "openai-gpt"
      model-family: "Claude"
      applicable-tasks:
        - text-chat
        - image-analysis
      max-input-tokens: 200000
      max-output-tokens: 8192
      include-max_tokens-above: 4096  # Claude truncates at 4096 if max_tokens not explicitly sent
      additional-capabilities:
        - image-input
      pricing:  # official pricing at base level
        input-usd-per-mTok: 3.0
        output-usd-per-mTok: 15.0
      parameters:
        temperature-range: [0.0, 1.0]
        top-p-range: [0.0, 1.0]
        default-temperature: None  # Claude 4+ cannot send both temperature and top_p
        default-top-p: 0.7
      rate-limit: "medium-concurrent"
      # variants: optional, use when model has dated/named versions
      variants:
        dated-20250514:
          providers:
            aihubmix:
              api-name: claude-sonnet-4-20250514
              rate-limit: "high-concurrent"
              max-input-tokens: 199999
            openrouter:
              api-name: anthropic/claude-sonnet-4-20250514
              rate-limit: "conservative-serialized"
      # providers: direct access when no variant needed
      providers:
        aihubmix:
          api-name: claude-sonnet-4-0
        openrouter:
          api-name: anthropic/claude-sonnet-4

    # Example: model without variants (simple structure)
    deepseek-chat:
      display-name: "DeepSeek V3.2 No-think"
      api-scheme: "openai-gpt"
      model-family: "DeepSeek"
      applicable-tasks:
        - text-chat
      max-input-tokens: 128000
      max-output-tokens: 8192
      include-max_tokens-above: 4096
      pricing:
        input-usd-per-mTok: 0.3
        output-usd-per-mTok: 0.45
      parameters:
        temperature-range: [0.0, 2.0]
        top-p-range: [0.0, 1.0]
        default-temperature: 1
        default-top-p: 0.7
      rate-limit: "medium-concurrent"
      providers:
        aihubmix:  # api-name omitted, uses model key "deepseek-chat"


    # Gemini 2.5 Pro (tiered pricing example)
    gemini-2.5-pro:
      display-name: "Gemini 2.5 Pro"
      api-scheme: "google-gemini"
      model-family: "Gemini"
      applicable-tasks:
        - text-chat
        - audio-transcription
        - image-analysis
      max-input-tokens: 1048576
      max-output-tokens: 65536
      additional-capabilities:
        - audio-input
        - image-input
      pricing:
        input-usd-per-mTok: [1.25, 2.5]  # [<=200k tokens, >200k tokens]
        output-usd-per-mTok: [10.0, 15.0]
        tiered-pricing-thresholds: [200000, 1048576]
      parameters:
        temperature-range: [0.0, 2.0]
        top-p-range: [0.0, 1.0]
        default-temperature: 1.0
        default-top-p: 0.95
      providers:
        aihubmix:  # api-name omitted, uses model key

    # Gemini 2.5 Flash
    gemini-2.5-flash:
      display-name: "Gemini 2.5 Flash"
      api-scheme: "google-gemini"
      model-family: "Gemini"
      applicable-tasks:
        - text-chat
        - audio-transcription
        - image-analysis
      max-input-tokens: 1048576
      max-output-tokens: 65536
      additional-capabilities:
        - audio-input
        - image-input
      pricing:
        input-usd-per-mTok: 0.3  # audio: 1.0
        output-usd-per-mTok: 2.5
      parameters:
        temperature-range: [0.0, 2.0]
        top-p-range: [0.0, 1.0]
        default-temperature: 1.0
        default-top-p: 0.95
      providers:
        aihubmix:

    # Gemini 2.5 Flash-Lite
    gemini-2.5-flash-lite:
      display-name: "Gemini 2.5 Flash-Lite"
      api-scheme: "google-gemini"
      model-family: "Gemini"
      applicable-tasks:
        - text-chat
        - audio-transcription
        - image-analysis
      max-input-tokens: 1048576
      max-output-tokens: 65536
      additional-capabilities:
        - audio-input
        - image-input
      pricing:
        input-usd-per-mTok: 0.1  # audio: 0.3
        output-usd-per-mTok: 0.4
      parameters:
        temperature-range: [0.0, 2.0]
        top-p-range: [0.0, 1.0]
        default-temperature: 1.0
        default-top-p: 0.95
      providers:
        aihubmix:

    whisper-large-v3:
      display-name: "Whisper Large v3"
      model-family: "Whisper"
      api-scheme: "openai-whisper"
      applicable-tasks:
        - audio-transcription
      providers:
        groq:
          # rate-limit not implemented
          rate-limit: "medium-concurrent"
          timestamp_granularities: segment # default to word

    whisper-1:
      display-name: "Whisper Large v2"
      model-family: "Whisper"
      api-scheme: "openai-whisper"
      applicable-tasks:
        - audio-transcription
      providers:
        aihubmix:
          rate-limit: "medium-concurrent"

  #------ end models ------#

  rate-limits:
    # 高性能并发模板
    high-concurrent:
      type: "concurrent"
      concurrent-settings:
        requests-per-minute: 50
        max-concurrent-calls: 10
      error-handling:
        max-retries: 3
        backoff-multiplier: 1.5
        initial-backoff-seconds: 1
    
    # 中等性能并发模板
    medium-concurrent:
      type: "concurrent"
      concurrent-settings:
        requests-per-minute: 20
        max-concurrent-calls: 5
      error-handling:
        max-retries: 3
        backoff-multiplier: 2
        initial-backoff-seconds: 2
    
    # 保守串行模板
    conservative-serialized:
      type: "serialized"
      serialized-settings:
        cooldown-seconds: 10
      error-handling:
        max-retries: 5
        backoff-multiplier: 2
        initial-backoff-seconds: 5

proxies:
  proxy1:
    type: http
    host: 127.0.0.1
    port: 1080
    timeout: 10 # seconds

tasks: # mark this field as needs delete, after implementing the text-audio-in-one model-selector widget then we can do this.
  transcription:
    max_segment_size: 15 # MB
    default_segment_duration: 180 # seconds
    overlap: 9 # seconds
    models:
      whisper-1:
        note: openai basic whisper model
      whisper-large-v3:
        note: claimed higher quality than whisper-1, but may be tuned too aggresive

paths:
  tmp_dir: "./tmp_audio_segments"
  result_dir: "./transcription_result"